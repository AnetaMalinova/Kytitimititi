<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4D5B1F">
<title>Kytitimiti</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon-180.png">

<style>
/* ===== Design tokens ===== */
:root{
  --bg:#F4F3E8; --surface:#FFFFFF; --surface-2:#ECEBDC; --border:#D9D8C6;
  --text:#1E2310; --text-2:#545A41;
  --primary:#4D5B1F; --primary-press:#3C4818; --on-primary:#FFFFFF; --primary-soft:#E3E7C9;
  --water:#2F6F9F; --water-soft:#DCEAF5;
  --warn:#9A4A12; --warn-soft:#F6E2D0;
  --danger:#A3261B; --on-danger:#FFFFFF;
  --shadow:0 1px 2px rgba(30,35,16,.06),0 4px 14px rgba(30,35,16,.08);
  --radius-s:12px; --radius-m:18px; --radius-l:26px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px; --space-6:32px;
  --tap:44px; --fab:60px; --avatar:64px;
  --font:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --fs-xs:.8125rem; --fs-s:.9375rem; --fs-m:1.0625rem; --fs-l:1.375rem; --fs-xl:1.875rem;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#12140C; --surface:#1C1F14; --surface-2:#262A1B; --border:#353A27;
  --text:#EEF0E2; --text-2:#B9BDA4;
  --primary:#B7C77C; --primary-press:#A3B567; --on-primary:#1A1F08; --primary-soft:#2F3719;
  --water:#7DB8E6; --water-soft:#1C2E3C;
  --warn:#F2A36B; --warn-soft:#3A2416;
  --danger:#F08A80; --on-danger:#2A0905;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.3);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12140C; --surface:#1C1F14; --surface-2:#262A1B; --border:#353A27;
    --text:#EEF0E2; --text-2:#B9BDA4;
    --primary:#B7C77C; --primary-press:#A3B567; --on-primary:#1A1F08; --primary-soft:#2F3719;
    --water:#7DB8E6; --water-soft:#1C2E3C;
    --warn:#F2A36B; --warn-soft:#3A2416;
    --danger:#F08A80; --on-danger:#2A0905;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}

/* ===== Base ===== */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:var(--fs-m);line-height:1.4;
  -webkit-tap-highlight-color:transparent;min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--water);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.app{max-width:640px;margin:0 auto;padding:calc(var(--space-4) + var(--safe-t)) calc(var(--space-4) + var(--safe-r)) calc(var(--fab) + var(--space-6) + var(--safe-b)) calc(var(--space-4) + var(--safe-l))}

/* Header */
.top{display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-4)}
.logo{width:48px;height:48px;border-radius:16px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;flex:none;transform:rotate(-6deg)}
.logo svg{width:30px;height:30px}
.top h1{margin:0;font-size:var(--fs-xl);letter-spacing:-.02em;line-height:1.1}
.top p{margin:2px 0 0;color:var(--text-2);font-size:var(--fs-s)}
.top .grow{flex:1;min-width:0}
.icon-btn{width:var(--tap);height:var(--tap);border-radius:50%;display:grid;place-items:center;color:var(--text-2)}
.icon-btn:active{background:var(--surface-2)}

/* Nudge */
.nudge{display:flex;align-items:center;gap:var(--space-3);background:var(--water-soft);color:var(--text);border-radius:var(--radius-m);padding:var(--space-3) var(--space-4);margin-bottom:var(--space-4);font-size:var(--fs-s)}
.nudge .grow{flex:1}
.nudge button{min-height:var(--tap);padding:0 var(--space-3);border-radius:999px;font-weight:700;color:var(--water)}

/* Cards */
.list{display:grid;gap:var(--space-3);list-style:none;margin:0;padding:0}
.card{position:relative;display:flex;align-items:center;gap:var(--space-3);background:var(--surface);border-radius:var(--radius-l);padding:var(--space-3);box-shadow:var(--shadow)}
.card.is-due{box-shadow:var(--shadow),inset 0 0 0 2px var(--warn)}
.card-main{flex:1;display:flex;align-items:center;gap:var(--space-3);min-width:0;text-align:left;min-height:var(--tap);border-radius:var(--radius-m)}
.avatar{position:relative;width:var(--avatar);height:var(--avatar);border-radius:22px;background:var(--primary-soft);flex:none;display:grid;place-items:center;font-size:34px;overflow:visible}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:22px;display:block}
.mood{position:absolute;right:-6px;bottom:-6px;width:28px;height:28px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:17px;box-shadow:var(--shadow)}
.meta{min-width:0;flex:1}
.meta h2{margin:0;font-size:var(--fs-m);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-xs);font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--text-2)}
.chip svg.i{width:15px;height:15px}
.chip.due{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--primary-soft);color:var(--primary)}
.chip.done{background:var(--water-soft);color:var(--water)}
.tank{height:6px;border-radius:3px;background:var(--surface-2);margin-top:8px;overflow:hidden}
.tank i{display:block;height:100%;background:var(--water);border-radius:3px;transition:width .5s ease}
.water-btn{position:relative;width:56px;height:56px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--water-soft);color:var(--water);transition:transform .15s}
.water-btn.hot{background:var(--water);color:var(--surface)}
.water-btn:active{transform:scale(.9)}
.water-btn svg.i{width:28px;height:28px}

/* Fun animations */
@keyframes boing{0%{transform:scale(1)}30%{transform:scale(1.04,.96)}55%{transform:scale(.98,1.03)}100%{transform:scale(1)}}
.card.boing{animation:boing .5s ease}
.drop{position:fixed;width:10px;height:14px;background:var(--water);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;pointer-events:none;z-index:60;animation:fly .8s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.card.boing,.drop,.sheet,.toast{animation:none!important;transition:none!important}}

/* Empty */
.empty{text-align:center;padding:var(--space-6) var(--space-4)}
.empty>svg{width:160px;height:160px}
.empty h2{margin:var(--space-4) 0 var(--space-2);font-size:var(--fs-l)}
.empty p{margin:0 auto var(--space-5);color:var(--text-2);max-width:28ch}

/* Buttons */
.btn{min-height:50px;padding:0 var(--space-5);border-radius:999px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2)}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-primary:active{background:var(--primary-press)}
.btn-soft{background:var(--surface-2);color:var(--text)}
.btn-water{background:var(--water);color:var(--surface)}
.btn-danger{background:var(--danger);color:var(--on-danger)}
.btn-text{color:var(--danger);background:none}
.btn-block{width:100%}
.fab{position:fixed;right:calc(var(--space-5) + var(--safe-r));bottom:calc(var(--space-5) + var(--safe-b));width:var(--fab);height:var(--fab);border-radius:22px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;box-shadow:0 6px 20px rgba(45,55,15,.35);z-index:20}
.fab svg.i{width:30px;height:30px;stroke-width:2.5}
.fab:active{transform:scale(.94)}

/* Sheet */
.backdrop{position:fixed;inset:0;background:rgba(10,12,5,.45);z-index:40;opacity:0;transition:opacity .2s}
.backdrop.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg);border-radius:var(--radius-l) var(--radius-l) 0 0;z-index:50;
  padding:var(--space-2) calc(var(--space-4) + var(--safe-r)) calc(var(--space-5) + var(--safe-b)) calc(var(--space-4) + var(--safe-l));
  transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.9,.3,1);max-width:640px;margin:0 auto;overscroll-behavior:contain}
.sheet.show{transform:translateY(0)}
.grabber{width:40px;height:5px;border-radius:3px;background:var(--border);margin:4px auto var(--space-3)}
.sheet-head{display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-4)}
.sheet-head h2{flex:1;margin:0;font-size:var(--fs-l)}
.field{margin-bottom:var(--space-5)}
.label{display:block;font-weight:700;font-size:var(--fs-s);margin-bottom:var(--space-2);color:var(--text-2)}
.input,.textarea{width:100%;min-height:50px;border-radius:var(--radius-s);border:2px solid var(--border);background:var(--surface);padding:var(--space-3) var(--space-4)}
.textarea{min-height:88px;resize:vertical}
.input:focus,.textarea:focus{border-color:var(--primary);outline:none}
.err{color:var(--danger);font-size:var(--fs-s);margin-top:var(--space-2)}
.photo-pick{display:flex;align-items:center;gap:var(--space-4)}
.photo-pick .avatar{width:96px;height:96px;font-size:48px;border-radius:30px}
.photo-pick .avatar img{border-radius:30px}
.photo-actions{display:flex;flex-direction:column;gap:var(--space-2);align-items:flex-start}
.file-label{position:relative;overflow:hidden}
.file-label input{position:absolute;inset:0;opacity:0;cursor:pointer}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:var(--space-2)}
.seg button{min-height:72px;border-radius:var(--radius-m);background:var(--surface);border:2px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:600;font-size:var(--fs-s);text-align:center;line-height:1.2;padding:var(--space-2) var(--space-1)}
.seg button[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.seg.small button{min-height:var(--tap);flex-direction:row}
.leaves{display:flex;gap:0}.leaves svg.i{width:18px;height:18px}
.hint{margin:var(--space-2) 0 0;font-size:var(--fs-xs)}
.stepper{display:flex;align-items:center;gap:var(--space-3);background:var(--surface);border-radius:var(--radius-m);padding:var(--space-2);border:2px solid var(--border)}
.stepper button{width:48px;height:48px;border-radius:14px;background:var(--surface-2);font-size:1.5rem;font-weight:700}
.stepper output{flex:1;text-align:center;font-weight:700;font-size:var(--fs-l)}
.presets{display:flex;gap:var(--space-2);flex-wrap:wrap;margin-top:var(--space-2)}
.presets button{min-height:var(--tap);min-width:var(--tap);padding:0 var(--space-3);border-radius:999px;background:var(--surface-2);font-weight:600;font-size:var(--fs-s)}
.presets button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.actions{display:flex;flex-direction:column;gap:var(--space-2);margin-top:var(--space-4)}

/* Detail */
.hero{width:100%;aspect-ratio:4/3;border-radius:var(--radius-l);background:var(--primary-soft);display:grid;place-items:center;font-size:96px;overflow:hidden;margin-bottom:var(--space-4)}
.hero img{width:100%;height:100%;object-fit:cover}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2);margin-bottom:var(--space-4)}
.fact{background:var(--surface);border-radius:var(--radius-m);padding:var(--space-3)}
.fact small{display:block;color:var(--text-2);font-size:var(--fs-xs);font-weight:600}
.fact strong{display:flex;align-items:center;gap:6px;margin-top:2px}
.note{background:var(--surface);border-radius:var(--radius-m);padding:var(--space-3) var(--space-4);margin-bottom:var(--space-4);white-space:pre-wrap}
.hist{list-style:none;padding:0;margin:0 0 var(--space-4);display:flex;flex-wrap:wrap;gap:6px}
.muted{color:var(--text-2);font-size:var(--fs-s)}
.section-title{font-size:var(--fs-s);font-weight:700;color:var(--text-2);margin:var(--space-4) 0 var(--space-2)}
.group{background:var(--surface);border-radius:var(--radius-m);padding:var(--space-4);margin-bottom:var(--space-4)}
.group .btn{margin-top:var(--space-2)}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(var(--fab) + var(--space-6) + var(--safe-b));transform:translate(-50%,20px);opacity:0;background:var(--text);color:var(--bg);border-radius:999px;padding:var(--space-2) var(--space-2) var(--space-2) var(--space-5);display:flex;align-items:center;gap:var(--space-3);z-index:70;width:max-content;max-width:calc(100% - 32px);transition:all .25s;box-shadow:var(--shadow);font-weight:600;font-size:var(--fs-s)}
.toast{pointer-events:none;visibility:hidden}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto;visibility:visible}
.toast button{min-height:var(--tap);padding:0 var(--space-4);border-radius:999px;font-weight:800;color:var(--primary-soft)}
:root[data-theme="dark"] .toast button{color:var(--primary-press)}
.toast:not(:has(button)){padding-right:var(--space-5);min-height:var(--tap)}
</style>
</head>

   Později napojit na nákupy v App Storu (StoreKit přes Capacitor plugin).
   ========================================================= */
const Entitlements = {
  plan: "free",
  features: { free: { maxPlants: Infinity, photos: true, backup: true } },
  can(feature, ctx) {
    const f = this.features[this.plan] || {};
    if (feature === "addPlant") return (ctx?.count ?? 0) < f.maxPlants;
    return !!f[feature];
  }
};

const I18N = {

    emptyCta: "Add first plant",
    add: "Add plant", edit: "Edit plant", save: "Save", cancel: "Cancel", close: "Close",
    del: "Delete", undo: "Undo", settings: "Settings",

/* =========================================================
   DATA – schéma, migrace, úložiště
   ========================================================= */
function defaultState() {
  return { schemaVersion: SCHEMA_VERSION, plants: [], settings: { lang: "auto", theme: "auto" }, lastBackupAt: null };
}
const MIGRATIONS = {
  // 0 -> 1: příklad budoucích migrací; data bez verze považujeme za v0
  0: s => ({ ...defaultState(), ...s, schemaVersion: 1 }),
  // 1 -> 2: náročnost péče a vlhkost vzduchu (u stávajících kytek nevyplněné)
  1: s => ({ ...s, plants: (s.plants || []).map(p => ({ ...p, care: p.care ?? null, humidity: p.humidity ?? null })), schemaVersion: 2 })
};
function migrate(raw) {
  if (!raw || typeof raw !== "object") return defaultState();
  let s = clone(raw);
  let v = Number.isInteger(s.schemaVersion) ? s.schemaVersion : 0;
  if (v > SCHEMA_VERSION) throw new Error("newer-schema");
  while (v < SCHEMA_VERSION) { s = MIGRATIONS[v](s); v = s.schemaVersion; }
  s.plants = Array.isArray(s.plants) ? s.plants.map(normalizePlant).filter(Boolean) : [];
  s.settings = { ...defaultState().settings, ...(s.settings || {}) };
  return s;
}
function normalizePlant(p) {
  if (!p || typeof p.name !== "string") return null;
  return {
    id: p.id || uid(), name: p.name.slice(0, 80), note: String(p.note || "").slice(0, 1000),
    photo: typeof p.photo === "string" && p.photo.startsWith("data:image/") ? p.photo : null,
    emoji: p.emoji || FALLBACK_EMOJI[0],
    light: LIGHTS.includes(p.light) ? p.light : "partial",
    care: CARE_LEVELS.includes(p.care) ? p.care : null,
    humidity: HUMIDITY_LEVELS.includes(p.humidity) ? p.humidity : null,
    intervalDays: clamp(parseInt(p.intervalDays, 10) || 7, LIMITS.intervalMin, LIMITS.intervalMax),
    lastWatered: p.lastWatered || null,
    history: Array.isArray(p.history) ? p.history.slice(0, LIMITS.historyMax) : [],
    createdAt: p.createdAt || new Date().toISOString()
  };
}

const Store = (() => {
  const DB = "kytitimiti", OS = "kv", KEY = "state";
  let mode = "idb", mem = null;
  function open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open(DB, 1);
      r.onupgradeneeded = () => r.result.createObjectStore(OS);
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
  }
  async function idb(fn) {
    const db = await open();
    return new Promise((res, rej) => {
      const tx = db.transaction(OS, "readwrite"); const st = tx.objectStore(OS);
      const r = fn(st); tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error);
    });
  }
  return {
    get available() { return mode !== "memory"; },
    async load() {
      try { if (!window.indexedDB) throw 0; return await idb(st => st.get(KEY)); }
      catch {
        try { mode = "ls"; const s = localStorage.getItem(DB); return s ? JSON.parse(s) : null; }
        catch { mode = "memory"; return mem; }
      }
    },
    async save(state) {
      try {
        if (mode === "idb") return await idb(st => st.put(state, KEY));
        if (mode === "ls") return localStorage.setItem(DB, JSON.stringify(state));
      } catch { mode = "memory"; }
      mem = clone(state);
    }
  };
})();

/* =========================================================
   LOGIKA – čisté funkce nad daty
   ========================================================= */
function plantStatus(p, now = new Date()) {
  const interval = p.intervalDays;
  const daysUntil = p.lastWatered ? interval - dayDiff(p.lastWatered, now) : 0;
  const wateredToday = !!p.lastWatered && dayDiff(p.lastWatered, now) === 0;
  let kind, label, mood;
  if (wateredToday) { kind = "done"; label = t("wateredToday"); mood = "😊"; }
  else if (daysUntil < 0) { kind = "due"; label = t("overdue", -daysUntil); mood = "🥵"; }
  else if (daysUntil === 0) { kind = "due"; label = t("dueToday"); mood = "😮"; }
  else { kind = "ok"; label = t("dueIn", daysUntil); mood = daysUntil / interval > .5 ? "😊" : "🙂"; }
  const level = p.lastWatered ? clamp(daysUntil / interval, 0, 1) : 0;
  const next = new Date(startOfDay(p.lastWatered || now).getTime() + (p.lastWatered ? interval : 0) * DAY);
  return { daysUntil, kind, label, mood, level, isDue: kind === "due", next };
}
const sortPlants = plants => [...plants].sort((a, b) => plantStatus(a).daysUntil - plantStatus(b).daysUntil || a.name.localeCompare(b.name, LANG));
function waterPlant(p, when = new Date()) {
  const iso = when.toISOString();
  return { ...p, lastWatered: iso, history: [iso, ...p.history].slice(0, LIMITS.historyMax) };
}
function needsBackupNudge(s, now = new Date()) {
  if (!s.plants.length) return false;
  if (!s.lastBackupAt) return s.plants.length >= 2;
  return dayDiff(s.lastBackupAt, now) >= 30;
}
function buildBackup(s) {
  return JSON.stringify({ app: "kytitimiti", exportedAt: new Date().toISOString(), appVersion: APP_VERSION, data: { ...s, lastBackupAt: undefined } });
}
function parseBackup(text) {
  const o = JSON.parse(text);
  if (!o || o.app !== "kytitimiti" || !o.data) throw new Error("bad");
  return migrate(o.data);
}

/* =========================================================
   STAV APLIKACE
   ========================================================= */
let state = defaultState();
let undoSnapshot = null;
async function commit(mutator, { undoable = false } = {}) {
  if (undoable) undoSnapshot = clone(state);
  mutator(state);
  await Store.save(state);
  render();
}
async function undo() {
  if (!undoSnapshot) return;
  state = undoSnapshot; undoSnapshot = null;
  await Store.save(state); applySettings(); render(); closeSheet();
}

const $app = document.getElementById("app");

function applySettings() {
  const s = state.settings;
  LANG = s.lang === "auto" ? ((navigator.language || "cs").toLowerCase().startsWith("cs") ? "cs" : "en") : s.lang;
  document.documentElement.lang = LANG;
  if (s.theme === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.dataset.theme = s.theme;
}

function render() {
  const plants = sortPlants(state.plants);
  const thirsty = plants.filter(p => plantStatus(p).isDue).length;
  const summary = !plants.length ? t("summaryEmpty") : thirsty ? t("summaryThirsty", thirsty) : t("summaryHappy") + " 🌞";
  document.title = thirsty ? `(${thirsty}) Kytitimiti` : "Kytitimiti";

  let html = `<header class="top">
    <div class="logo">${icon("leaf")}</div>
    <div class="grow"><h1>Kytitimiti</h1><p>${esc(summary)}</p></div>
    <button class="icon-btn" type="button" data-act="settings" aria-label="${esc(t("settings"))}">${icon("gear")}</button>
  </header>`;
  if (!Store.available) html += `<div class="nudge" role="alert"><span class="grow">${esc(t("storageWarn"))}</span></div>`;
  else if (needsBackupNudge(state)) html += `<div class="nudge"><span class="grow">${esc(t("backupNudge"))}</span><button type="button" data-act="settings">${esc(t("backupNow"))}</button></div>`;

  if (!plants.length) {
    html += `<section class="empty">${EMPTY_ART}<h2>${esc(t("emptyTitle"))}</h2><p>${esc(t("emptyText"))}</p>
      <button class="btn btn-primary" type="button" data-act="add">${icon("plus")}${esc(t("emptyCta"))}</button></section>`;
  } else {
    html += `<ul class="list">${plants.map(cardHtml).join("")}</ul>`;

  $fab.hidden = !plants.length;
  $fab.innerHTML = icon("plus");
  $fab.setAttribute("aria-label", t("add"));
}

      <p class="muted hint">${esc(t("careHint"))}</p></div>
    ${isNew ? `<div class="field"><span class="label" id="pf-lw-l">${esc(t("lastWatered"))}</span>
      <div class="seg small" role="group" aria-labelledby="pf-lw-l">${["today", "yesterday", "unknown"].map(k => `<button type="button" data-lw="${k}" aria-pressed="${draft.lw === k}">${esc(t("lw_" + k))}</button>`).join("")}</div></div>` : ""}
    <div class="field"><label class="label" for="pf-note">${esc(t("note"))}</label>
      <textarea class="textarea" id="pf-note" maxlength="1000" placeholder="${esc(t("notePh"))}">${esc(draft.note)}</textarea></div>
    <button class="btn btn-primary btn-block" type="submit">${esc(t("save"))}</button>
  </form>`;

  openSheet(isNew ? t("add") : t("edit"), body, sheet => {
    const $ = s => sheet.querySelector(s);
    const sync = () => {
      $("#pf-av").innerHTML = avatarHtml(draft, false);
      $("#pf-photo-lbl").textContent = draft.photo ? t("changePhoto") : t("addPhoto");
      $("#pf-rm").hidden = !draft.photo;
      $("#pf-int").textContent = t("every", draft.intervalDays);
      sheet.querySelectorAll("[data-preset]").forEach(b => b.setAttribute("aria-pressed", +b.dataset.preset === draft.intervalDays));
      sheet.querySelectorAll("[data-light]").forEach(b => b.setAttribute("aria-pressed", b.dataset.light === draft.light));
      sheet.querySelectorAll("[data-care]").forEach(b => b.setAttribute("aria-pressed", b.dataset.care === draft.care));
      sheet.querySelectorAll("[data-hum]").forEach(b => b.setAttribute("aria-pressed", b.dataset.hum === draft.humidity));
      sheet.querySelectorAll("[data-lw]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lw === draft.lw));
    };
    sync();
    sheet.addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      if (b.dataset.light) draft.light = b.dataset.light;
      else if (b.dataset.care) draft.care = draft.care === b.dataset.care ? null : b.dataset.care;
      else if (b.dataset.hum) draft.humidity = draft.humidity === b.dataset.hum ? null : b.dataset.hum;
      else if (b.dataset.step) draft.intervalDays = clamp(draft.intervalDays + +b.dataset.step, LIMITS.intervalMin, LIMITS.intervalMax);
      else if (b.dataset.preset) draft.intervalDays = +b.dataset.preset;
      else if (b.dataset.lw) draft.lw = b.dataset.lw;
      else if (b.id === "pf-rm") draft.photo = null;
      else return;
      sync();
    });
    $("#pf-file").addEventListener("change", async e => {
      const f = e.target.files[0]; if (!f) return;
      try { draft.photo = await resizeImage(f); sync(); } catch { toast(t("photoError")); }
      e.target.value = "";
    });
    $("#pf-name").addEventListener("input", () => { $("#pf-err").hidden = true; });
    $("#pf").addEventListener("submit", async e => {
      e.preventDefault();
      const name = $("#pf-name").value.trim();
      if (!name) { $("#pf-err").hidden = false; $("#pf-name").focus(); return; }
      draft.name = name; draft.note = $("#pf-note").value.trim();
      if (isNew) {
        const now = new Date();
        let p = normalizePlant({ ...draft, id: uid(), history: [] });
        if (draft.lw === "today") p = waterPlant(p, now);
        else if (draft.lw === "yesterday") p = waterPlant(p, new Date(now.getTime() - DAY));
        await commit(s => s.plants.push(p));
        closeSheet(); toast(t("added", p.name));
      } else {
        await commit(s => { const i = s.plants.findIndex(x => x.id === plant.id); s.plants[i] = normalizePlant({ ...s.plants[i], ...draft }); }, { undoable: true });
        closeSheet(); toast(t("saved"), true);
      }
    });
  });
}

function resizeImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const k = Math.min(1, LIMITS.photoMaxPx / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", LIMITS.photoQuality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("img")); };
    img.src = url;
  });
}

/* ----- Detail ----- */
function openDetail(id) {
  const p = state.plants.find(x => x.id === id); if (!p) return;
  const st = plantStatus(p);
  const hist = p.history.length
    ? `<ul class="hist">${p.history.slice(0, 12).map(h => `<li class="chip done">${icon("drop")}${esc(fmtDate(h))}</li>`).join("")}</ul>`
    : `<p class="muted">${esc(t("neverWatered"))}</p>`;
  const body = `<div class="hero">${p.photo ? `<img src="${p.photo}" alt="${esc(p.name)}">` : `<span aria-hidden="true">${p.emoji}</span>`}</div>
    <div class="facts">
      <div class="fact"><small>${esc(t("nextWatering"))}</small><strong>${icon("calendar")}${esc(st.isDue ? st.label : fmtDate(st.next))}</strong></div>
      <div class="fact"><small>${esc(t("interval"))}</small><strong>${icon("drop")}${esc(t("every", p.intervalDays))}</strong></div>
      <div class="fact"><small>${esc(t("light"))}</small><strong>${icon(p.light)}${esc(t("light_" + p.light))}</strong></div>
      ${p.humidity ? `<div class="fact"><small>${esc(t("humidity"))}</small><strong>${icon("drop")}${esc(t("humidity_" + p.humidity))}</strong></div>` : ""}
      ${p.care ? `<div class="fact"><small>${esc(t("care"))}</small><strong>${icon("leaf")}${esc(t("care_" + p.care))}</strong></div>` : ""}
      <div class="fact"><small>${esc(t("lastWateredFact"))}</small><strong>${esc(p.lastWatered ? fmtDate(p.lastWatered) : "—")}</strong></div>
    </div>
    ${p.note ? `<div class="note">${esc(p.note)}</div>` : ""}
    <div class="section-title">${esc(t("history"))}</div>${hist}
    <div class="actions">
      <button class="btn btn-water btn-block" type="button" data-d="water">${icon("drop")}${esc(t("water"))}</button>
      <button class="btn btn-soft btn-block" type="button" data-d="edit">${icon("edit")}${esc(t("edit"))}</button>
      <button class="btn btn-text btn-block" type="button" data-d="delete">${icon("trash")}${esc(t("del"))}</button>
    </div>`;
  openSheet(p.name, body, sheet => {
    sheet.addEventListener("click", async e => {
      const b = e.target.closest("[data-d]"); if (!b) return;
      if (b.dataset.d === "water") { closeSheet(); doWater(p.id); }
      if (b.dataset.d === "edit") { closeSheet(); setTimeout(() => openForm(p), 230); }
      if (b.dataset.d === "delete") {
        closeSheet();
        await new Promise(r => setTimeout(r, 230));
        const ok = await confirmDialog({ title: t("confirmDeleteTitle", p.name), text: t("confirmDeleteText"), okLabel: t("del") });
        if (ok) { await commit(s => { s.plants = s.plants.filter(x => x.id !== p.id); }, { undoable: true }); toast(t("deleted"), true); }
      }
    });
  });
}

/* ----- Water ----- */
async function doWater(id) {
  const p = state.plants.find(x => x.id === id); if (!p) return;
  const btn = $app.querySelector(`[data-id="${CSS.escape(id)}"] .water-btn`);
  if (btn) splash(btn);
  await commit(s => { const i = s.plants.findIndex(x => x.id === id); s.plants[i] = waterPlant(s.plants[i]); }, { undoable: true });
  const card = $app.querySelector(`[data-id="${CSS.escape(id)}"]`);
  if (card) { card.classList.add("boing"); }
  const msgs = I18N[LANG].thanks;
  toast(msgs[Math.floor(Math.random() * msgs.length)](p.name), true);
}
function splash(el) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const r = el.getBoundingClientRect(); const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  for (let i = 0; i < 10; i++) {
    const d = document.createElement("span"); d.className = "drop";
    const a = (Math.PI * 2 * i) / 10 + Math.random() * .4, dist = 40 + Math.random() * 40;
    d.style.left = cx - 5 + "px"; d.style.top = cy - 7 + "px";
    d.style.setProperty("--dx", Math.cos(a) * dist + "px"); d.style.setProperty("--dy", Math.sin(a) * dist - 20 + "px");
    document.body.appendChild(d); setTimeout(() => d.remove(), 850);
  }
}

/* ----- Settings ----- */
function openSettings() {
  const s = state.settings;
  const seg = (key, opts) => `<div class="seg small" role="group" aria-label="${esc(t(key))}">${opts.map(o => `<button type="button" data-set="${key}" data-val="${o}" aria-pressed="${s[key === "language" ? "lang" : "theme"] === o}">${esc(t((key === "language" ? "lang_" : "theme_") + o))}</button>`).join("")}</div>`;
  const body = `
    <div class="section-title">${esc(t("backup"))}</div>
    <div class="group">
      <p class="muted" style="margin-top:0">${esc(t("backupInfo"))}</p>
      <p><strong id="bk-last">${esc(state.lastBackupAt ? t("lastBackup", fmtDate(state.lastBackupAt, { day: "numeric", month: "numeric", year: "numeric", hour: "2-digit", minute: "2-digit" })) : t("neverBackup"))}</strong></p>
      ${inFrame ? "" : `<button class="btn btn-primary btn-block" type="button" data-b="file">${esc(t("exportFile"))}</button>`}
      <button class="btn ${inFrame ? "btn-primary" : "btn-soft"} btn-block" type="button" data-b="copy">${esc(t("exportCopy"))}</button>
      <label class="btn btn-soft btn-block file-label">${esc(t("importFile"))}<input type="file" accept="application/json,.json,.txt" id="bk-file"></label>
      <textarea class="textarea" id="bk-paste" placeholder="${esc(t("pasteHere"))}" aria-label="${esc(t("pasteHere"))}" style="margin-top:8px"></textarea>
      <button class="btn btn-soft btn-block" type="button" data-b="paste">${esc(t("importPaste"))}</button>
    </div>
    <div class="section-title">${esc(t("language"))}</div>${seg("language", ["auto", "cs", "en"])}
    <div class="section-title">${esc(t("theme"))}</div>${seg("theme", ["auto", "light", "dark"])}
    <p class="muted" style="text-align:center;margin-top:24px">${esc(t("about", APP_VERSION))}</p>`;
  openSheet(t("settings"), body, sheet => {
    sheet.addEventListener("click", async e => {
      const b = e.target.closest("button"); if (!b) return;
      if (b.dataset.set) {
        const k = b.dataset.set === "language" ? "lang" : "theme";
        await commit(st => { st.settings[k] = b.dataset.val; });
        applySettings(); render(); closeSheet(); setTimeout(openSettings, 230);
      }
      if (b.dataset.b === "file") exportFile();
      if (b.dataset.b === "copy") exportCopy();
      if (b.dataset.b === "paste") importText(sheet.querySelector("#bk-paste").value);
    });
    sheet.querySelector("#bk-file").addEventListener("change", async e => {
      const f = e.target.files[0]; if (f) importText(await f.text()); e.target.value = "";
    });
  });
}
async function markBackedUp() { await commit(s => { s.lastBackupAt = new Date().toISOString(); }); }
async function exportFile() {
  const name = `kytitimiti-${new Date().toISOString().slice(0, 10)}.json`;
  const blob = new Blob([buildBackup(state)], { type: "application/json" });
  // iPhone: sdílecí nabídka → „Uložit do Souborů“; jinde klasické stažení
  try {
    const file = new File([blob], name, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: name });
      await markBackedUp(); closeSheet(); toast(t("backupSaved")); return;
    }
  } catch (err) { if (err && err.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  await markBackedUp(); closeSheet(); toast(t("backupSaved"));
}
async function exportCopy() {
  try { await navigator.clipboard.writeText(buildBackup(state)); await markBackedUp(); closeSheet(); toast(t("copied")); }
  catch { toast(t("copyFailed")); }
}
async function importText(text) {
  let data;
  try { data = parseBackup(String(text || "").trim()); } catch { toast(t("importError")); return; }
  closeSheet(); await new Promise(r => setTimeout(r, 230));
  const ok = await confirmDialog({ title: t("importConfirmTitle"), text: t("importConfirmText", data.plants.length), okLabel: t("restore") });
  if (!ok) return;
  await commit(s => { const lb = s.lastBackupAt; Object.assign(s, data, { lastBackupAt: lb }); }, { undoable: true });
  applySettings(); render(); toast(t("imported"), true);
}

/* ----- Global events ----- */
$app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const id = b.closest("[data-id]")?.dataset.id;
  ({ add: () => openForm(), settings: openSettings, detail: () => openDetail(id), water: () => doWater(id) })[b.dataset.act]?.();
});
$app.addEventListener("animationend", e => e.target.classList.remove("boing"));
$fab.addEventListener("click", () => {
  if (!Entitlements.can("addPlant", { count: state.plants.length })) return; // budoucí paywall
  openForm();
});
// Přepnutí dne / návrat do aplikace → přepočítat stavy
let lastDay = startOfDay(new Date()).getTime();
setInterval(() => { const d = startOfDay(new Date()).getTime(); if (d !== lastDay) { lastDay = d; render(); } }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });

/* ----- Boot ----- */
(async () => {
  try { state = migrate(await Store.load()); } catch { state = defaultState(); }
  applySettings(); render();
  if ("serviceWorker" in navigator && !inFrame && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
</script>
</body>
